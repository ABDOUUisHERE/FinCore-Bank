spring:
  application:
    name: api-gateway
  http:
    codecs:
      max-in-memory-size: 16KB
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
          routes:
            - id: cards
              uri: ${CARD_SERVICE_URL:http://localhost:8088}
              predicates: ["Path=/api/v1/cards,/api/v1/cards/**,/api/v1/card-authorizations,/api/v1/card-authorizations/**,/api/v1/card-merchants"]
              # Account lookup, delegated exchange and Ledger each have a 5s bound.
              metadata:
                response-timeout: 20000
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: statements
              uri: ${REPORTING_SERVICE_URL:http://localhost:8089}
              predicates: ["Path=/api/v1/statements,/api/v1/statements/**,/api/v1/admin/reports/reconciliation"]
              metadata:
                response-timeout: 20000
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: customer-me
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/customers/me,/api/v1/customers/me/onboarding,/api/v1/customers/me/profile
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: accounts
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: beneficiaries
              uri: ${BENEFICIARY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/beneficiaries,/api/v1/beneficiaries/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: notification-stream
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates: [Path=/api/v1/notifications/stream]
              metadata:
                response-timeout: -1
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates: ["Path=/api/v1/notifications,/api/v1/notifications/**"]
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: fraud
              uri: ${FRAUD_SERVICE_URL:http://localhost:8087}
              predicates: ["Path=/api/v1/admin/fraud-alerts,/api/v1/admin/fraud-cases,/api/v1/admin/fraud-cases/**,/api/v1/admin/fraud-rules"]
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
            - id: transfers
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/transfers,/api/v1/transfers/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
server:
  port: ${SERVER_PORT:8280}
  max-http-request-header-size: 16KB
fincore:
  security:
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/fincore}
    jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/fincore/protocol/openid-connect/certs}
    audience: fincore-api
    origins: http://localhost:5173,http://localhost:5174
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
