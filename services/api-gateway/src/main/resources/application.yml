spring:
  application:
    name: api-gateway
  http:
    codecs:
      max-in-memory-size: 16KB
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
          routes:
            - id: customer-me
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/customers/me
              filters:
                - name: RequestSize
                  args:
                    maxSize: 16KB
server:
  port: ${SERVER_PORT:8280}
  max-http-request-header-size: 16KB
fincore:
  security:
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/fincore}
    jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/fincore/protocol/openid-connect/certs}
    audience: fincore-api
    origins: http://localhost:5173,http://localhost:5174
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
