spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DATABASE_URL:jdbc:postgresql://localhost:5432/audit}
    username: audit_runtime
    password: ${AUDIT_DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8090}
  max-http-request-header-size: 16KB
fincore:
  audit:
    messaging-enabled: ${AUDIT_MESSAGING_ENABLED:false}
  security:
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/fincore}
    jwk-set-uri: ${OIDC_JWKS:http://localhost:8180/realms/fincore/protocol/openid-connect/certs}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
