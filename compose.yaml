      PAYMENT_URL: http://payment-service:8080
      CUSTOMER_URL: http://customer-service:8080
      BENEFICIARY_URL: http://beneficiary-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
