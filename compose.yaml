    networks: [backend]
  fraud-service:
    image: fincore/fraud-service:local
    build: { context: ., dockerfile: services/fraud-service/Dockerfile }
    environment:
      SERVER_PORT: '8080'
      FRAUD_DATABASE_URL: jdbc:postgresql://postgres:5432/fraud
