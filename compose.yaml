name: fincore
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: fincore_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Run local bootstrap first}
      CUSTOMER_MIGRATION_PASSWORD: ${CUSTOMER_MIGRATION_PASSWORD:?Run local bootstrap first}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run local bootstrap first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fincore_bootstrap -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
  realm-config:
    image: quay.io/keycloak/keycloak:26.8.1
    user: '0:0'
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        cp /source/fincore-realm.json /output/fincore-realm.json
        && chown 1000:0 /output/fincore-realm.json
        && chmod 0640 /output/fincore-realm.json
    volumes:
      - ./.local/realm:/source:ro
      - realm-data:/output
    network_mode: none
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_owner
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run local bootstrap first}
      KC_BOOTSTRAP_ADMIN_USERNAME: platform-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run local bootstrap first}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8180"]
    volumes: ["realm-data:/opt/keycloak/data/import:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      realm-config: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q UP <&3'",
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 30
    networks: [backend]
  customer-migrations:
    image: fincore/customer-service:local
    build: { context: ., dockerfile: services/customer-service/Dockerfile }
    command: [--migrate-only]
    environment:
      CUSTOMER_DATABASE_URL: jdbc:postgresql://postgres:5432/customer
      CUSTOMER_MIGRATION_PASSWORD: ${CUSTOMER_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  customer-service:
    image: fincore/customer-service:local
    build: { context: ., dockerfile: services/customer-service/Dockerfile }
    environment:
      MESSAGING_ENABLED: 'true'
      SPRING_TASK_SCHEDULING_POOL_SIZE: '4'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER: customer
      KAFKA_PASSWORD: ${KAFKA_CUSTOMER_PASSWORD:?Run local bootstrap first}
      SERVER_PORT: "8080"
      CUSTOMER_DATABASE_URL: jdbc:postgresql://postgres:5432/customer
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Run local bootstrap first}
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      customer-migrations: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  ledger-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: [/bin/sh, /bootstrap/init-ledger.sh]
    environment:
      PGHOST: postgres
      PGUSER: fincore_bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?Run local bootstrap first}
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?Run local bootstrap first}
    volumes: ["./infrastructure/docker/postgres/init-ledger.sh:/bootstrap/init-ledger.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  ledger-migrations:
    image: fincore/ledger-service:local
    build: { context: ., dockerfile: services/ledger-service/Dockerfile }
    command: [--migrate-only]
    environment:
      LEDGER_DATABASE_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck:
      disable: true
    depends_on:
      ledger-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  ledger-identity:
    image: python:3.14.2-alpine
    user: '65534:65534'
    command: [python, /scripts/configure-ledger-client.py]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run local bootstrap first}
      LEDGER_CLIENT_SECRET: ${LEDGER_CLIENT_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/configure-ledger-client.py:/scripts/configure-ledger-client.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      keycloak: { condition: service_healthy }
    networks: [backend]
  ledger-service:
    image: fincore/ledger-service:local
    build: { context: ., dockerfile: services/ledger-service/Dockerfile }
    environment:
      MESSAGING_ENABLED: 'true'
      SPRING_TASK_SCHEDULING_POOL_SIZE: '4'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER: ledger
      KAFKA_PASSWORD: ${KAFKA_LEDGER_PASSWORD:?Run local bootstrap first}
      SERVER_PORT: '8080'
      LEDGER_DATABASE_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?Run local bootstrap first}
      LEDGER_RISK_CLIENT_SECRET: ${LEDGER_RISK_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      FRAUD_URL: http://fraud-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      ledger-migrations: { condition: service_completed_successfully }
      ledger-identity: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  ledger-check:
    image: python:3.14.2-alpine
    profiles: [tools]
    user: '65534:65534'
    command: [python, /scripts/check-ledger.py]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      LEDGER_URL: http://ledger-service:8080
      LEDGER_CLIENT_SECRET: ${LEDGER_CLIENT_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/check-ledger.py:/scripts/check-ledger.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      ledger-service: { condition: service_healthy }
    networks: [backend]
  business-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: [/bin/sh, /bootstrap/init-business.sh]
    environment:
      PGHOST: postgres
      PGUSER: fincore_bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Run local bootstrap first}
      ACCOUNT_MIGRATION_PASSWORD: ${ACCOUNT_MIGRATION_PASSWORD:?Run local bootstrap first}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run local bootstrap first}
      PAYMENT_MIGRATION_PASSWORD: ${PAYMENT_MIGRATION_PASSWORD:?Run local bootstrap first}
    volumes: ["./infrastructure/docker/postgres/init-business.sh:/bootstrap/init-business.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  business-identity:
    image: python:3.14.2-alpine
    user: '65534:65534'
    command: [python, /scripts/configure-business-clients.py]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run local bootstrap first}
      ACCOUNT_CLIENT_SECRET: ${ACCOUNT_CLIENT_SECRET:?Run local bootstrap first}
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:?Run local bootstrap first}
      PAYMENT_OPERATOR_SECRET: ${PAYMENT_OPERATOR_SECRET:?Run local bootstrap first}
      RECIPIENT_PASSWORD: ${RECIPIENT_PASSWORD:?Run local bootstrap first}
      BENEFICIARY_CLIENT_SECRET: ${BENEFICIARY_CLIENT_SECRET:?Run local bootstrap first}
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?Run local bootstrap first}
      NOTIFICATION_OPERATOR_SECRET: ${NOTIFICATION_OPERATOR_SECRET:?Run local bootstrap first}
      FRAUD_CLIENT_SECRET: ${FRAUD_CLIENT_SECRET:?Run local bootstrap first}
      FRAUD_ANALYST_PASSWORD: ${FRAUD_ANALYST_PASSWORD:?Run local bootstrap first}
      CARD_CLIENT_SECRET: ${CARD_CLIENT_SECRET:?Run local bootstrap first}
      REPORTING_CLIENT_SECRET: ${REPORTING_CLIENT_SECRET:?Run local bootstrap first}
      FINANCE_PASSWORD: ${FINANCE_PASSWORD:?Run local bootstrap first}
      LEDGER_RISK_CLIENT_SECRET: ${LEDGER_RISK_CLIENT_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/configure-business-clients.py:/scripts/configure-business-clients.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      ledger-identity: { condition: service_completed_successfully }
    networks: [backend]
  account-migrations:
    image: fincore/account-service:local
    build: { context: ., dockerfile: services/account-service/Dockerfile }
    command: [--migrate-only]
    environment:
      ACCOUNT_DATABASE_URL: jdbc:postgresql://postgres:5432/account
      ACCOUNT_MIGRATION_PASSWORD: ${ACCOUNT_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck:
      disable: true
    depends_on:
      business-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  account-service:
    image: fincore/account-service:local
    build: { context: ., dockerfile: services/account-service/Dockerfile }
    environment:
      MESSAGING_ENABLED: 'true'
      SPRING_TASK_SCHEDULING_POOL_SIZE: '4'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER: account
      KAFKA_PASSWORD: ${KAFKA_ACCOUNT_PASSWORD:?Run local bootstrap first}
      SERVER_PORT: '8080'
      ACCOUNT_DATABASE_URL: jdbc:postgresql://postgres:5432/account
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Run local bootstrap first}
      ACCOUNT_CLIENT_SECRET: ${ACCOUNT_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      LEDGER_URL: http://ledger-service:8080
      CUSTOMER_URL: http://customer-service:8080
      ACCOUNT_URL: http://account-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      account-migrations: { condition: service_completed_successfully }
      business-identity: { condition: service_completed_successfully }
      ledger-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  payment-migrations:
    image: fincore/payment-service:local
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    command: [--migrate-only]
    environment:
      PAYMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/payment
      PAYMENT_MIGRATION_PASSWORD: ${PAYMENT_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck:
      disable: true
    depends_on:
      business-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  payment-service:
    image: fincore/payment-service:local
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      MESSAGING_ENABLED: 'true'
      SPRING_TASK_SCHEDULING_POOL_SIZE: '4'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER: payment
      KAFKA_PASSWORD: ${KAFKA_PAYMENT_PASSWORD:?Run local bootstrap first}
      SERVER_PORT: '8080'
      PAYMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/payment
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run local bootstrap first}
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      FRAUD_URL: http://fraud-service:8080
      LEDGER_URL: http://ledger-service:8080
      CUSTOMER_URL: http://customer-service:8080
      ACCOUNT_URL: http://account-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      payment-migrations: { condition: service_completed_successfully }
      fraud-service: { condition: service_healthy }
      business-identity: { condition: service_completed_successfully }
      ledger-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  business-check:
    image: python:3.14.2-alpine
    profiles: [tools]
    user: '65534:65534'
    command: [python, /scripts/check-business.py]
    stdin_open: true
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      API_URL: http://api-gateway:8080
      PAYMENT_URL: http://payment-service:8080
      LEDGER_URL: http://ledger-service:8080
      PAYMENT_OPERATOR_SECRET: ${PAYMENT_OPERATOR_SECRET:?Run local bootstrap first}
      LEDGER_CLIENT_SECRET: ${LEDGER_CLIENT_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/check-business.py:/scripts/check-business.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [backend]
  simulation-fund:
    image: python:3.14.2-alpine
    profiles: [tools]
    user: '65534:65534'
    entrypoint: [python, /scripts/fund-simulation.py]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      PAYMENT_URL: http://payment-service:8080
      PAYMENT_OPERATOR_SECRET: ${PAYMENT_OPERATOR_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/fund-simulation.py:/scripts/fund-simulation.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  customer-fixture:
    image: python:3.14.2-alpine
    profiles: [tools]
    user: '65534:65534'
    entrypoint: [python, /scripts/prepare-customer-journey.py]
    stdin_open: true
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      API_URL: http://api-gateway:8080
      PAYMENT_URL: http://payment-service:8080
      LEDGER_URL: http://ledger-service:8080
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run local bootstrap first}
      PAYMENT_OPERATOR_SECRET: ${PAYMENT_OPERATOR_SECRET:?Run local bootstrap first}
      LEDGER_CLIENT_SECRET: ${LEDGER_CLIENT_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/prepare-customer-journey.py:/scripts/prepare-customer-journey.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  beneficiary-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: [/bin/sh, /bootstrap/init-beneficiaries.sh]
    environment:
      PGHOST: postgres
      PGUSER: fincore_bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      BENEFICIARY_DB_PASSWORD: ${BENEFICIARY_DB_PASSWORD:?Run local bootstrap first}
      BENEFICIARY_MIGRATION_PASSWORD: ${BENEFICIARY_MIGRATION_PASSWORD:?Run local bootstrap first}
    volumes: ["./infrastructure/docker/postgres/init-beneficiaries.sh:/bootstrap/init-beneficiaries.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  beneficiary-migrations:
    image: fincore/beneficiary-service:local
    build: { context: ., dockerfile: services/beneficiary-service/Dockerfile }
    command: [--migrate-only]
    environment:
      BENEFICIARY_DATABASE_URL: jdbc:postgresql://postgres:5432/beneficiary
      BENEFICIARY_MIGRATION_PASSWORD: ${BENEFICIARY_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck: { disable: true }
    depends_on:
      beneficiary-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  beneficiary-service:
    image: fincore/beneficiary-service:local
    build: { context: ., dockerfile: services/beneficiary-service/Dockerfile }
    environment:
      SERVER_PORT: '8080'
      BENEFICIARY_DATABASE_URL: jdbc:postgresql://postgres:5432/beneficiary
      BENEFICIARY_DB_PASSWORD: ${BENEFICIARY_DB_PASSWORD:?Run local bootstrap first}
      BENEFICIARY_CLIENT_SECRET: ${BENEFICIARY_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      ACCOUNT_URL: http://account-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      beneficiary-migrations: { condition: service_completed_successfully }
      business-identity: { condition: service_completed_successfully }
      account-service: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  card-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: [/bin/sh, /bootstrap/init-card.sh]
    environment:
      PGHOST: postgres
      PGUSER: fincore_bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      CARD_DB_PASSWORD: ${CARD_DB_PASSWORD:?Run local bootstrap first}
      CARD_MIGRATION_PASSWORD: ${CARD_MIGRATION_PASSWORD:?Run local bootstrap first}
    volumes: ["./infrastructure/docker/postgres/init-card.sh:/bootstrap/init-card.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  card-migrations:
    image: fincore/card-service:local
    build: { context: ., dockerfile: services/card-service/Dockerfile }
    command: [--migrate-only]
    environment:
      CARD_DATABASE_URL: jdbc:postgresql://postgres:5432/card
      CARD_MIGRATION_PASSWORD: ${CARD_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck: { disable: true }
    depends_on:
      card-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  card-service:
    image: fincore/card-service:local
    build: { context: ., dockerfile: services/card-service/Dockerfile }
    environment:
      MESSAGING_ENABLED: 'true'
      SPRING_TASK_SCHEDULING_POOL_SIZE: '4'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER: card
      KAFKA_PASSWORD: ${KAFKA_CARD_PASSWORD:?Run local bootstrap first}
      FRAUD_URL: http://fraud-service:8080
      SERVER_PORT: '8080'
      CARD_DATABASE_URL: jdbc:postgresql://postgres:5432/card
      CARD_DB_PASSWORD: ${CARD_DB_PASSWORD:?Run local bootstrap first}
      CARD_CLIENT_SECRET: ${CARD_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      ACCOUNT_URL: http://account-service:8080
      LEDGER_URL: http://ledger-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      card-migrations: { condition: service_completed_successfully }
      business-identity: { condition: service_completed_successfully }
      account-service: { condition: service_healthy }
      fraud-service: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  reporting-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: [/bin/sh, /bootstrap/init-reporting.sh]
    environment:
      PGHOST: postgres
      PGUSER: fincore_bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Run local bootstrap first}
      REPORTING_MIGRATION_PASSWORD: ${REPORTING_MIGRATION_PASSWORD:?Run local bootstrap first}
    volumes: ["./infrastructure/docker/postgres/init-reporting.sh:/bootstrap/init-reporting.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  reporting-migrations:
    image: fincore/reporting-service:local
    build: { context: ., dockerfile: services/reporting-service/Dockerfile }
    command: [--migrate-only]
    environment:
      REPORTING_DATABASE_URL: jdbc:postgresql://postgres:5432/reporting
      REPORTING_MIGRATION_PASSWORD: ${REPORTING_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck: { disable: true }
    depends_on:
      reporting-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  reporting-service:
    image: fincore/reporting-service:local
    build: { context: ., dockerfile: services/reporting-service/Dockerfile }
    environment:
      SERVER_PORT: '8080'
      REPORTING_DATABASE_URL: jdbc:postgresql://postgres:5432/reporting
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Run local bootstrap first}
      REPORTING_CLIENT_SECRET: ${REPORTING_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      ACCOUNT_URL: http://account-service:8080
      LEDGER_URL: http://ledger-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
    depends_on:
      reporting-migrations: { condition: service_completed_successfully }
      business-identity: { condition: service_completed_successfully }
      account-service: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  kafka-config:
    image: python:3.14.2-alpine
    user: '0:0'
    entrypoint: [sh, -ec]
    command: ['cp /source/* /output/ && chown -R 1000:1000 /output && chmod 0500 /output && chmod 0400 /output/* && chown 1000:1000 /data && chmod 0700 /data']
    volumes: ["./.local/kafka:/source:ro", "kafka-config:/output", "kafka-data:/data"]
    network_mode: none
  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:broker;User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/server-jaas.conf
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/tmp/kraft-combined-logs", "kafka-config:/etc/kafka/secrets:ro"]
    depends_on:
      kafka-config: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /etc/kafka/secrets/admin.properties >/dev/null 2>&1']
      interval: 10s
      timeout: 30s
      start_period: 30s
      retries: 30
    networks: [backend]
  kafka-init:
    image: apache/kafka:4.2.2
    entrypoint: [/bin/sh, /bootstrap/configure.sh]
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
    volumes: ["./infrastructure/docker/kafka/configure.sh:/bootstrap/configure.sh:ro", "kafka-config:/etc/kafka/secrets:ro"]
    depends_on:
      kafka: { condition: service_healthy }
    networks: [backend]
  notification-operator:
    image: python:3.14.2-alpine
    profiles: [tools]
    user: '65534:65534'
    entrypoint: [python, /scripts/notification-operations.py]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      NOTIFICATION_URL: http://notification-service:8080
      NOTIFICATION_OPERATOR_SECRET: ${NOTIFICATION_OPERATOR_SECRET:?Run local bootstrap first}
    volumes: ["./scripts/notification-operations.py:/scripts/notification-operations.py:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
  notification-bootstrap:
    image: postgres:17.11-alpine
    entrypoint: [/bin/sh, /bootstrap/init-notifications.sh]
    environment:
      PGHOST: postgres
      PGUSER: fincore_bootstrap
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run local bootstrap first}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run local bootstrap first}
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?Run local bootstrap first}
    volumes: ["./infrastructure/docker/postgres/init-notifications.sh:/bootstrap/init-notifications.sh:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
  notification-migrations:
    image: fincore/notification-service:local
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    command: [--migrate-only]
    environment:
      NOTIFICATION_DATABASE_URL: jdbc:postgresql://postgres:5432/notification
      NOTIFICATION_MIGRATION_PASSWORD: ${NOTIFICATION_MIGRATION_PASSWORD:?Run local bootstrap first}
    healthcheck: { disable: true }
    depends_on:
      notification-bootstrap: { condition: service_completed_successfully }
    networks: [backend]
  notification-service:
    image: fincore/notification-service:local
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      SERVER_PORT: '8080'
      NOTIFICATION_DATABASE_URL: jdbc:postgresql://postgres:5432/notification
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run local bootstrap first}
      SPRING_TASK_SCHEDULING_POOL_SIZE: '4'
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?Run local bootstrap first}
      TOKEN_ENDPOINT: http://keycloak:8180/realms/fincore/protocol/openid-connect/token
      ACCOUNT_URL: http://account-service:8080
      OIDC_ISSUER: http://localhost:8180/realms/fincore
      OIDC_JWKS: http://keycloak:8180/realms/fincore/protocol/openid-connect/certs
      MESSAGING_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USER: notification
      KAFKA_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD:?Run local bootstrap first}
    depends_on:
      notification-migrations: { condition: service_completed_successfully }
      business-identity: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      account-service: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks: [backend]
  fraud-bootstrap:
    image: postgres:17.11-alpine
