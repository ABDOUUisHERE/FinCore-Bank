name: Backend quality
on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            libraries/*/target/surefire-reports/*.xml
            libraries/*/target/failsafe-reports/*.xml
            services/*/target/surefire-reports/*.xml
            services/*/target/failsafe-reports/*.xml
