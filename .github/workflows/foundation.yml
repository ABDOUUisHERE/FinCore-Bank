name: Foundation integration
on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: python3 scripts/bootstrap-local.py
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/check-foundation.py
      - run: docker compose run --rm ledger-check
      - run: npm run test:e2e
      - if: failure()
        run: python3 scripts/diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-workspace-captures
          path: test-results/foundation-*.png
      - if: always()
        run: docker compose down
