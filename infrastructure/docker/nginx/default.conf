server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8180 http://localhost:8080; frame-src http://localhost:8180; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health { access_log off; return 200 'ok'; }
    location / { try_files $uri $uri/ /index.html; }
}
