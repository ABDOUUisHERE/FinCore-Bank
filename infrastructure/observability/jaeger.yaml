service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: warn
extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    http:
      endpoint: 0.0.0.0:16686
    storage:
      traces: local_traces
  jaeger_storage:
    backends:
      local_traces:
        memory:
          max_traces: 10000
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 200ms
    send_batch_size: 64
exporters:
  jaeger_storage_exporter:
    trace_storage: local_traces
